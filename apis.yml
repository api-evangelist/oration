name: Oration *
description: 'Oration (Oration PBC, product OrationRx) was a Foster City, California prescription-savings
  SaaS that helped self-insured employers and their employees find the lowest-priced medications,
  analyzing over $1B in prescription drug purchases. Backed by GV (Google Ventures), Andreessen
  Horowitz, DCVC, Chicago Ventures and others (~$11.2M raised). The company was acquired by PokitDok
  in June 2017; its own domains (oration.io, orationrx.com) no longer resolve and no public API,
  developer portal, or documentation surface remains. Retained in the API Evangelist network as a
  historical life-sciences / pharmacy-benefits portfolio lead.'
